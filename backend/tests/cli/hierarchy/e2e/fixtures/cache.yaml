schema_version: 1
cores:
  count: 1
  mapping:
    - id: 0
      l1: L1
caches:
  - name: L1
    role: L1
    private_to: 0
    size_bytes: 128 B
    line_size: 32 B
    associativity: 2
    replacement: LRU
    write_policy: write-back
    write_allocate: true
    delay_cycles: 1
    next: LLC
  - name: LLC
    role: LLC
    size_bytes: 256 B
    line_size: 32 B
    associativity: 2
    replacement: LRU
    write_policy: write-back
    write_allocate: true
    delay_cycles: 12
    next: Memory
memory:
  name: Memory
  delay_cycles: 120
